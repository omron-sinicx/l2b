<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L2B crowd simulation</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff;
      }
      .three-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .credit {
        position: absolute;
        right: 8px;
        bottom: 4px;
        font: 10px/1.4 sans-serif;
        color: #999;
      }
      .credit a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <!-- three.js crowd simulation ported from denkiwakame.github.io/l2b (gh-pages).
         The bundle sizes its canvas from .three-container and loads samples/*.glb relative to this page.
         l2b.bundle.js is patched to loop: the trajectory index wraps one frame after the robot first reaches its final (goal) position. -->
    <div class="three-container">
      <div id="js-three-canvas"></div>
    </div>
    <div class="credit">
      Pedestrian model by <a href="https://mixamo.com" target="_blank">mixamo.com</a>.
      Robot model by <a href="https://www.patreon.com/quaternius" target="_blank">Tomás Laulhé</a>,
      modifications by <a href="https://donmccurdy.com/" target="_blank">Don McCurdy</a>. CC0 1.0.
    </div>
    <script src="l2b.bundle.js"></script>
    <script>
      // Restyle the path-clearing (beep) effect: the bundle toggles a flat yellow disc
      // (Renderer.beepCircle) once per second. Recolor it to the page accent, keep it under
      // the robot every frame, and add ripples spreading out to the beep range (radius 1).
      (function () {
        var R = window.Renderer;
        if (!R || !R.beepCircle) return;
        var ACCENT = 0xe55927; // $accent-color in src/scss/theme.scss
        var core = R.beepCircle;
        function style(mesh, opacity) {
          mesh.material.color.setHex(ACCENT);
          mesh.material.transparent = true;
          mesh.material.depthWrite = false;
          mesh.material.opacity = opacity;
        }
        style(core, 0.3);
        var ripples = [0, 0.5].map(function (phase) {
          var m = core.clone();
          m.material = core.material.clone();
          style(m, 0);
          m.userData.phase = phase;
          R.scene.add(m);
          return m;
        });
        var PERIOD = 1.0; // seconds per ripple
        var BEEP_RANGE = 1.0; // r^(b): pedestrians within this range react to the beep
        var FADE = 0.8; // seconds for a highlighted pedestrian to fade back to gray
        var t0 = performance.now();
        var last = t0;
        var lastTick = null;
        var affected = {}; // ped index -> true while the current beep affects it
        var level = {}; // ped index -> highlight strength in [0, 1]

        // Tint pedestrians hit by a beep so their reaction is visible. The bundle snaps
        // everyone to the trajectory once per second (R.globalTime); our rAF runs after it,
        // so on a tick the positions are exactly the data's.
        function tintPeds(dt) {
          if (R.globalTime !== lastTick) {
            lastTick = R.globalTime;
            affected = {};
            var robot = R.model.robots[0];
            if (core.visible && robot) {
              R.model.peds.forEach(function (ped, i) {
                if (ped && ped.scene.position.distanceTo(robot.scene.position) < BEEP_RANGE) affected[i] = true;
              });
            }
          }
          R.model.peds.forEach(function (ped, i) {
            if (!ped) return;
            level[i] = affected[i] ? 1 : Math.max(0, (level[i] || 0) - dt / FADE);
            ped.scene.traverse(function (o) {
              if (!o.isMesh) return;
              var ud = o.material.userData;
              if (!ud.gray) {
                ud.gray = o.material.color.clone();
                ud.accent = o.material.color.clone().setHex(ACCENT);
              }
              o.material.color.copy(ud.gray).lerp(ud.accent, level[i]);
            });
          });
        }

        (function tick() {
          requestAnimationFrame(tick);
          var now = performance.now();
          tintPeds((now - last) / 1000);
          last = now;
          var robot = R.model.robots[0];
          var t = (now - t0) / 1000;
          [core].concat(ripples).forEach(function (m) {
            if (robot) m.position.set(robot.scene.position.x, 0.01, robot.scene.position.z);
          });
          ripples.forEach(function (m) {
            var p = (t / PERIOD + m.userData.phase) % 1;
            m.visible = core.visible;
            m.scale.set(0.2 + 0.8 * p, 0.2 + 0.8 * p, 1);
            m.material.opacity = 0.6 * (1 - p);
          });
        })();
      })();
    </script>
  </body>
</html>
