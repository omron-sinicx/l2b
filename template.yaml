overview: |
  This work presents a deep reinforcement learning framework for interactive navigation in a crowded place. Our proposed approach, Learning to Balance (L2B) framework enables mobile robot agents to steer safely towards their destinations by avoiding collisions with a crowd, while actively clearing a path by asking nearby pedestrians to make room, if necessary, to keep their travel efficient. We observe that the safety and efficiency requirements in crowd-aware navigation have a trade-off in the presence of social dilemmas between the agent and the crowd. On the one hand, intervening in pedestrian paths too much to achieve instant efficiency will result in collapsing a natural crowd flow and may eventually put everyone, including the self, at risk of collisions. On the other hand, keeping in silence to avoid every single collision will lead to the agent's inefficient travel. With this observation, our L2B framework augments the reward function used in learning an interactive navigation policy to penalize frequent active path clearing and passive collision avoidance, which substantially improves the balance of the safety-efficiency trade-off. We evaluate our L2B framework in a challenging crowd simulation and demonstrate its superiority, in terms of both navigation success and collision rate, over a state-of-the-art navigation approach.

body:
  - title: Collision Avoidance or Path Clearing?
    text: |
      When a robot moves through a dense crowd, it has two options: wait for people to pass and avoid them (**passive collision avoidance**), or ask nearby people to make room (**active path clearing**, e.g., by beeping). Neither is good on its own.

      <img src="problem.png" class="uk-align-center uk-responsive-width" alt="Freezing robot problem and interactive navigation" />
      <span class="uk-text-meta">Fig. 1: Left: freezing robot problem, where a robot struggles to find a bypass and as a result takes unnecessary maneuvers, ending in a timeout or a collision. Right: our agent interacts with the crowd by actively clearing a path or passively finding a bypass, balancing the safety-efficiency trade-off.</span>

      - **Only avoiding** keeps everyone safe, but in a crowded scene the robot cannot find a gap. It freezes, takes long detours, and eventually times out or collides (Fig. 1, left).
      - **Always intervening** gets the robot through quickly at first, but pushing people around collapses the natural crowd flow. Once the crowd has no room left to give way, everyone, including the robot, is at higher risk of collision.

      We view this as a **social dilemma** between the robot and the crowd, treated as a single virtual *crowd agent*. Mutual cooperation $R$ is when both sides make reasonable room for each other. Passive avoidance alone leaves the robot with the sucker outcome $S$, and aggressive path clearing gives the robot a short-term temptation payoff $T$ that turns into mutual defection $P$ once the crowd can no longer make room. L2B learns **when** to clear a path and **when** to detour, so the robot stays in $R$ (Fig. 1, right).
  - title: Method
    text: |
      L2B augments the navigation reward with a term $R_s$ coming from the crowd. Its first part, weighted by $\beta$, penalizes active path clearing when pedestrians are within the beep range $r^{(b)}$, discouraging the move from $R$ to $T$. Its second part, weighted by $\eta$, penalizes getting closer than a discomfort distance, discouraging the move from $R$ to $S$. Setting $\eta > \beta$ makes getting too close worse than clearing a path, so the policy learns to stay in $R$ by using both actions sparingly. The value network is trained with V-learning on top of SARL.

      $$
      R_s(s_t^{jn}, a_t) =
      \begin{cases}
      \beta \, (d_t - r^{(b)}) & \text{if } d_t < r^{(b)} \wedge b_t = 1 \\
      \eta \, (d_t - d_{\rm disc}) & \text{else if } d_t < d_{\rm disc} \\
      0 & \text{otherwise}
      \end{cases}
      $$

      To simulate how a crowd reacts to path clearing, pedestrians follow a simplified **Emotional Reciprocal Velocity Obstacles (ERVO)** model: everyone inside the half-circle of radius $r^{(b)}$ in front of the robot changes direction when it beeps. The simulator is available at [Python-ERVO](https://github.com/denkiwakame/Python-ERVO).

      <img src="method.png" class="uk-align-center uk-responsive-width" alt="ERVO-based reactive pedestrians" />
      <span class="uk-text-meta">Fig. 2: ERVO-based reactive pedestrians. A circle and triangles represent the robot and pedestrians (left). When the robot executes an active path clearing action, all pedestrians within the half-circle of radius r<sup>(b)</sup> (right) change their directions.</span>
  - title: Results
    text: |
      In circle-crossing scenarios with N pedestrians, L2B-SARL keeps its success rate around 90% as the crowd grows, while the SARL baseline drops to 70.0% at N = 20, mainly because of timeouts.

      #### Success, collision and timeout rates, and average navigation time
      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr><th>N</th><th>Methods</th><th>Success [%] ↑</th><th>Collision [%] ↓</th><th>Timeout [%] ↓</th><th>Time [s] ↓</th></tr>
          </thead>
          <tbody>
            <tr><td rowspan="2">20</td><td>SARL</td><td>70.0</td><td>18.4</td><td>11.6</td><td><b>13.50</b></td></tr>
            <tr class="uk-active"><td><b>L2B-SARL (ours)</b></td><td><b>90.6</b> <span class="uk-text-success">(+20.6)</span></td><td><b>9.4</b> <span class="uk-text-success">(-9.0)</span></td><td><b>0.0</b> <span class="uk-text-success">(-11.6)</span></td><td>13.85 <span class="uk-text-danger">(+0.35)</span></td></tr>
            <tr><td rowspan="2">15</td><td>SARL</td><td>77.8</td><td><b>6.4</b></td><td>15.8</td><td>12.43</td></tr>
            <tr class="uk-active"><td><b>L2B-SARL (ours)</b></td><td><b>88.0</b> <span class="uk-text-success">(+10.2)</span></td><td>11.8 <span class="uk-text-danger">(+5.4)</span></td><td><b>0.2</b> <span class="uk-text-success">(-15.6)</span></td><td><b>11.60</b> <span class="uk-text-success">(-0.83)</span></td></tr>
            <tr><td rowspan="2">10</td><td>SARL</td><td><b>92.2</b></td><td><b>4.6</b></td><td>3.2</td><td>11.91</td></tr>
            <tr class="uk-active"><td><b>L2B-SARL (ours)</b></td><td>90.4 <span class="uk-text-danger">(-1.8)</span></td><td>8.6 <span class="uk-text-danger">(+4.0)</span></td><td><b>0.4</b> <span class="uk-text-success">(-2.8)</span></td><td><b>11.31</b> <span class="uk-text-success">(-0.60)</span></td></tr>
            <tr><td rowspan="2">5</td><td>SARL</td><td>96.6</td><td>3.2</td><td>0.2</td><td><b>10.09</b></td></tr>
            <tr class="uk-active"><td><b>L2B-SARL (ours)</b></td><td><b>97.8</b> <span class="uk-text-success">(+1.2)</span></td><td><b>2.0</b> <span class="uk-text-success">(-1.2)</span></td><td>0.2 <span class="uk-text-muted">(±0)</span></td><td>10.14 <span class="uk-text-danger">(+0.05)</span></td></tr>
            <tr><td rowspan="2">avg.</td><td>SARL</td><td>84.1</td><td>8.1</td><td>7.7</td><td>11.98</td></tr>
            <tr class="uk-active"><td><b>L2B-SARL (ours)</b></td><td><b>91.7</b> <span class="uk-text-success">(+7.6)</span></td><td><b>7.9</b> <span class="uk-text-success">(-0.2)</span></td><td><b>0.2</b> <span class="uk-text-success">(-7.5)</span></td><td><b>11.72</b> <span class="uk-text-success">(-0.26)</span></td></tr>
          </tbody>
        </table>
      </div>
      <span class="uk-text-meta">Values in parentheses are differences from SARL (percentage points; seconds for Time).</span>

      #### Qualitative results
      L2B-SARL (top) clears its path with a few beeps and goes through the crowd, while SARL (bottom) takes long detours around it.

      <img src="qualitative.png" class="uk-align-center uk-responsive-width" alt="Qualitative results" />
      <span class="uk-text-meta">Fig. 3: (a)-(d) L2B-SARL and (e)-(h) SARL for N = 5, 10, 15, 20. Gray points are pedestrians and filled orange circles are the robot. Bigger orange circles are path clearing (beep) actions.</span>

      #### Balancing path clearing
      With too small a penalty $\beta$, the robot beeps too often, confusing the crowd and causing collisions. L2B learns to mix path clearing and collision avoidance.

      <div class="uk-child-width-1-2@m uk-flex-middle" uk-grid>
        <div>
          <img src="apc.png" class="uk-align-center uk-responsive-width" alt="Effect of path clearing frequency" />
          <span class="uk-text-meta">Fig. 4: (a) Too frequent active path clearing (APC) causes traffic confusion. (b) Our approach balances path clearing and collision avoidance.</span>
        </div>
        <div>
          <img src="beta.png" class="uk-align-center uk-responsive-width" alt="Effect of beta" />
          <span class="uk-text-meta">Fig. 5: (a) Frequency of active path clearing and (b) success rate for each combination of β and the number of pedestrians N.</span>
        </div>
      </div>
